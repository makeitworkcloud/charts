{{- if .Values.memoryPilot.enabled -}}
{{- if not .Values.fullnameOverride -}}
{{- fail "memoryPilot.enabled=true requires an explicit distinct fullnameOverride (contract: opencode-memory-pilot)" -}}
{{- end -}}
{{- if eq .Values.fullnameOverride "opencode" -}}
{{- fail "memoryPilot.enabled=true must not render the production fullnameOverride opencode" -}}
{{- end -}}
{{- if not .Values.persistence.existingClaim -}}
{{- fail "memoryPilot.enabled=true requires a dedicated persistence.existingClaim (contract: opencode-memory-pilot-home)" -}}
{{- end -}}
{{- if eq .Values.persistence.existingClaim "opencode-home" -}}
{{- fail "memoryPilot.enabled=true must not use the production home claim opencode-home" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode-server.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    ignore-check.kube-linter.io/unset-cpu-requirements: "single-node policy"
    ignore-check.kube-linter.io/unset-memory-requirements: "single-node policy"
    secret.reloader.stakater.com/reload: {{ .Values.memoryPilot.providerSecretName | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "opencode-server.fullname" . }}
  template:
    metadata:
      annotations:
        checksum/opencode-server-config: {{ include (print $.Template.BasePath "/pilot-configmap.yaml") . | sha256sum }}
      labels:
        app: {{ include "opencode-server.fullname" . }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-opencode-config
          image: docker.io/alpine/git:v2.49.1
          command: [/bin/sh, -ec]
          args:
            - |
              cp -a /config-source/. /home/opencode/.config/opencode/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /home/opencode/.config/opencode
            - name: config-source
              mountPath: /config-source
              readOnly: true
      containers:
        - name: opencode
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: [/bin/sh, -ec]
          args:
            - |
              set -eu
              deadline=600
              waited=0
              until wget -q -O /dev/null http://127.0.0.1:8080/health; do
                if [ "$waited" -ge "$deadline" ]; then
                  echo "text-embeddings-inference sidecar not healthy after $deadline seconds" >&2
                  exit 1
                fi
                sleep 2
                waited=$((waited + 2))
              done
              exec /usr/local/bin/opencode web --hostname 0.0.0.0 --port 4096
          env:
            - name: HOME
              value: /home/opencode
            - name: ZHIPU_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.memoryPilot.providerSecretName }}, key: ZHIPU_API_KEY}
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.memoryPilot.serverSecretName }}, key: password}
          ports:
            - name: http
              containerPort: 4096
          readinessProbe:
            tcpSocket: {port: http}
          livenessProbe:
            tcpSocket: {port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: home
              mountPath: /home/opencode
            - name: config
              mountPath: /home/opencode/.config/opencode
            - name: tmp
              mountPath: /tmp
        - name: tei
          image: {{ .Values.memoryPilot.tei.image.repository }}:{{ .Values.memoryPilot.tei.image.tag }}
          args:
            - --model-id
            - {{ .Values.memoryPilot.tei.modelId | quote }}
            - --revision
            - {{ .Values.memoryPilot.tei.modelRevision | quote }}
            - --hostname
            - 127.0.0.1
            - --port
            - "8080"
            - --huggingface-hub-cache
            - /models
            - --auto-truncate
          readinessProbe:
            exec:
              command: [curl, -fsS, "http://127.0.0.1:8080/health"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [curl, -fsS, "http://127.0.0.1:8080/health"]
            periodSeconds: 10
          startupProbe:
            exec:
              command: [curl, -fsS, "http://127.0.0.1:8080/health"]
            periodSeconds: 10
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tei-tmp
              mountPath: /tmp
      volumes:
        - name: home
          persistentVolumeClaim: {claimName: {{ .Values.persistence.existingClaim }}}
        - name: config
          emptyDir: {}
        - name: config-source
          configMap:
            name: {{ include "opencode-server.fullname" . }}-config
            items:
              - key: opencode.json
                path: opencode.json
              - key: opencode-mem.jsonc
                path: opencode-mem.jsonc
              - key: AGENTS.md
                path: AGENTS.md
        - name: tmp
          emptyDir: {}
        - name: models
          emptyDir: {}
        - name: tei-tmp
          emptyDir: {}
{{ end -}}
