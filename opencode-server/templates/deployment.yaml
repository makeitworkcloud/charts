apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode-server.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    ignore-check.kube-linter.io/unset-cpu-requirements: "single-node policy"
    ignore-check.kube-linter.io/unset-memory-requirements: "single-node policy"
    secret.reloader.stakater.com/reload: {{ .Values.secrets.openaiAuth | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "opencode-server.fullname" . }}
  template:
    metadata:
      annotations:
        checksum/opencode-server-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app: {{ include "opencode-server.fullname" . }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-opencode-config
          image: docker.io/alpine/git:v2.49.1
          command: [/bin/sh, -ec]
          args:
            - |
              cp -a /config-source/. /home/opencode/.config/opencode/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /home/opencode/.config/opencode
            - name: config-source
              mountPath: /config-source
              readOnly: true
        - name: seed-openai-auth
          image: docker.io/alpine/git:v2.49.1
          command: [/bin/sh, -ec]
          args:
            - |
              auth_dir=/home/opencode/.local/share/opencode
              auth_file="$auth_dir/auth.json"
              revision_file=/secrets/openai/auth-seed-revision
              marker_file="$auth_dir/.auth-seed-revision"

              mkdir -p "$auth_dir"
              test -s /secrets/openai/auth.json
              if [ -f "$revision_file" ] && [ ! -s "$revision_file" ]; then
                echo "OpenAI auth seed revision must not be empty" >&2
                exit 1
              fi

              seed_auth() {
                umask 077
                cp /secrets/openai/auth.json "$auth_file.tmp"
                chmod 600 "$auth_file.tmp"
                mv "$auth_file.tmp" "$auth_file"
                if [ -f "$revision_file" ]; then
                  cp "$revision_file" "$marker_file.tmp"
                  chmod 600 "$marker_file.tmp"
                  mv "$marker_file.tmp" "$marker_file"
                else
                  rm -f "$marker_file"
                fi
              }

              if [ ! -s "$auth_file" ]; then
                seed_auth
              elif [ -f "$revision_file" ] && { [ ! -f "$marker_file" ] || ! cmp -s "$revision_file" "$marker_file"; }; then
                seed_auth
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: home
              mountPath: /home/opencode
            - name: openai-auth
              mountPath: /secrets/openai
              readOnly: true
      containers:
        - name: opencode
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args: [web, --hostname, 0.0.0.0, --port, "4096"]
          env:
            - name: HOME
              value: /home/opencode
            - name: KIMI_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.kimi }}, key: KIMI_API_KEY}
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.minimax }}, key: MINIMAX_API_KEY}
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.serverAuth }}, key: password}
            - name: ZHIPU_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.zai }}, key: ZHIPU_API_KEY}
          ports:
            - name: http
              containerPort: 4096
          readinessProbe:
            tcpSocket: {port: http}
          livenessProbe:
            tcpSocket: {port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: home
              mountPath: /home/opencode
            - name: artifacts
              mountPath: /artifacts
            - name: config
              mountPath: /home/opencode/.config/opencode
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          persistentVolumeClaim: {claimName: {{ .Values.persistence.existingClaim }}}
        - name: artifacts
          persistentVolumeClaim: {claimName: {{ .Values.persistence.artifactsExistingClaim }}}
        - name: openai-auth
          secret: {secretName: {{ .Values.secrets.openaiAuth }}}
        - name: config
          emptyDir: {}
        - name: config-source
          configMap:
            name: {{ include "opencode-server.fullname" . }}-config
            items:
              - key: opencode.json
                path: opencode.json
              - key: AGENTS.md
                path: AGENTS.md
{{- range $path, $_ := .Files.Glob "files/agents/*.md" }}
              - key: {{ base $path }}
                path: agents/{{ base $path }}
{{- end }}
{{- range $path, $_ := .Files.Glob "files/skills/*/SKILL.md" }}
              - key: {{ trimPrefix "files/" $path | replace "/" "-" }}
                path: {{ trimPrefix "files/" $path }}
{{- end }}
        - name: tmp
          emptyDir: {}
