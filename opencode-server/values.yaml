fullnameOverride: opencode

image:
  repository: ghcr.io/anomalyco/opencode
  tag: "1.18.29@sha256:ecc3bf96ee55dad226d9cde50d79aaa8a1215c47860c0fcdc71570461bf438b8"

persistence:
  existingClaim: opencode-home
  artifactsExistingClaim: opencode-artifacts

secrets:
  kimi: opencode-kimi
  minimax: opencode-minimax
  openaiAuth: opencode-openai-auth
  serverAuth: opencode-server-auth
  zai: opencode-zai

# Opt-in isolated memory pilot. When enabled, the chart renders ONLY the pilot
# ConfigMap and Deployment (OpenCode plus a same-pod text-embeddings-inference
# sidecar) and suppresses the production ConfigMap and Deployment. Requires a
# distinct fullnameOverride and a dedicated home claim; rendering fails on the
# production values. See docs/memory-pilot.md.
memoryPilot:
  enabled: false
  providerSecretName: opencode-memory-pilot-provider
  serverSecretName: opencode-memory-pilot-server-auth
  tei:
    image:
      repository: ghcr.io/huggingface/text-embeddings-inference
      tag: "cpu-1.9.4"
    modelId: nomic-ai/nomic-embed-text-v1
    modelRevision: 3ac47f125a41961d13b397d0332866be2f9152e1
