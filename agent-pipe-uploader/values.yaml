fullnameOverride: agent-pipe-uploader

image:
  repository: ghcr.io/makeitworkcloud/agent-pipe-uploader
  # STAGING ONLY: unpublished images branch head, NOT a verified registry artifact.
  # MERGE BLOCKER: replace with the verified main-published immutable SHA/digest.
  # A squash merge produces a different SHA. Never substitute latest.
  tag: "63ccfde32e70decf81255e816cd2ada57b4f7e10"

persistence:
  existingClaim: opencode-artifacts

service:
  port: 8080

mcp:
  allowedHosts:
    - agent-pipe-uploader
    - agent-pipe-uploader.opencode
    - agent-pipe-uploader.opencode.svc
    - agent-pipe-uploader.opencode.svc.cluster.local

profiles:
  agent-pipe:
    operations: [upload, download, verify]
    allowedHosts:
      - agent-pipe.s3.amazonaws.com
      - agent-pipe.s3.us-west-2.amazonaws.com
    pathPrefixes:
      - /deliveries/
    requiredQueryParameters:
      - X-Amz-Algorithm
      - X-Amz-Credential
      - X-Amz-Date
      - X-Amz-Expires
      - X-Amz-SignedHeaders
      - X-Amz-Signature
    maxBytes: 104857600
  agent-presentations:
    operations: [upload, download, verify]
    allowedHosts:
      - agent-pipe.s3.amazonaws.com
      - agent-pipe.s3.us-west-2.amazonaws.com
    pathPrefixes:
      - /presentations/
    requiredQueryParameters:
      - X-Amz-Algorithm
      - X-Amz-Credential
      - X-Amz-Date
      - X-Amz-Expires
      - X-Amz-SignedHeaders
      - X-Amz-Signature
    maxBytes: 104857600
  slidespeak-exports:
    operations: [download, verify]
    allowedHosts:
      - slidespeak-files.s3.amazonaws.com
      - slidespeak-files.s3.us-east-2.amazonaws.com
    pathPrefixes:
      - /
    requiredQueryParameters:
      - X-Amz-Algorithm
      - X-Amz-Credential
      - X-Amz-Date
      - X-Amz-Expires
      - X-Amz-SignedHeaders
      - X-Amz-Signature
    maxBytes: 104857600
