fullnameOverride: agent-pipe-uploader

image:
  repository: ghcr.io/makeitworkcloud/agent-pipe-uploader
  tag: latest

persistence:
  existingClaim: opencode-artifacts

service:
  port: 8080

mcp:
  allowedHosts:
    - agent-pipe-uploader
    - agent-pipe-uploader.opencode
    - agent-pipe-uploader.opencode.svc
    - agent-pipe-uploader.opencode.svc.cluster.local

profiles:
  agent-pipe:
    # Keep this list aligned with the S3 endpoint generated by the presigning role.
    # The service rejects every other destination to prevent it becoming an HTTP proxy.
    allowedHosts:
      - agent-pipe.s3.amazonaws.com
      - agent-pipe.s3.us-west-2.amazonaws.com
    pathPrefixes:
      - /deliveries/
    requiredQueryParameters:
      - X-Amz-Algorithm
      - X-Amz-Credential
      - X-Amz-Expires
      - X-Amz-Signature
    maxBytes: 104857600
