apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-pipe-uploader.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    ignore-check.kube-linter.io/unset-cpu-requirements: "single-node policy"
    ignore-check.kube-linter.io/unset-memory-requirements: "single-node policy"
  labels:
    {{- include "agent-pipe-uploader.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "agent-pipe-uploader.fullname" . }}
  template:
    metadata:
      annotations:
        checksum/agent-pipe-uploader-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "agent-pipe-uploader.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uploader
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: MCP_ALLOWED_HOSTS
              value: {{ join "," .Values.mcp.allowedHosts | quote }}
            - name: PROFILE_CONFIG_PATH
              value: /etc/agent-pipe/profiles.json
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: profiles
              mountPath: /etc/agent-pipe
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        - name: profiles
          configMap:
            name: {{ include "agent-pipe-uploader.fullname" . }}-config
        - name: tmp
          emptyDir: {}
