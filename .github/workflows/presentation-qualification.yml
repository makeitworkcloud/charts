name: presentation-qualification

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/presentation-qualification.yml"
      - ".github/tests/presentation-qualification/**"

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use host Python 3.11 (parent-verified action pin)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Fixture unit tests (stdlib only)
        run: >-
          python3 -m unittest discover
          -s .github/tests/presentation-qualification/unit
          -t .github/tests/presentation-qualification -v

  runtime-qualification:
    needs: static-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use host Python 3.11 (parent-verified action pin)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check out pinned Enterprise Gateway sources (BSD-3-Clause, not forked)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jupyter-server/enterprise_gateway
          ref: 0344929cbca688440ba1bc8f5faa074fe54bd595
          path: upstream-eg
          persist-credentials: false
      - name: Runtime qualification (core gate; network gate reported separately)
        run: bash .github/tests/presentation-qualification/runtime/run_runtime_suite.sh
