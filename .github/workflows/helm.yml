name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - id: hygiene
        name: Run repository hygiene
        continue-on-error: true
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=never 2>&1 | tee hygiene.log
      - id: helm
        name: Run Helm validation
        if: always()
        continue-on-error: true
        run: make test 2>&1 | tee helm.log
      - name: Report validation on pull request
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALIDATION_FAILED: ${{ steps.hygiene.outcome == 'failure' || steps.helm.outcome == 'failure' }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- charts-ci-status -->';
            const failed = process.env.VALIDATION_FAILED === 'true';
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (failed) {
              const maxLength = 12000;
              const log = ['hygiene.log', 'helm.log']
                .filter(fs.existsSync)
                .map((file) => `### ${file}\n${fs.readFileSync(file, 'utf8')}`)
                .join('\n\n')
                .replace(/\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b/g, '***REDACTED***');
              const excerpt = log.length > maxLength ? log.slice(-maxLength) : log;
              body = `${marker}
              ## Chart CI failed

              [View the workflow run](${workflowUrl})

              <details><summary>Validation output (redacted, last ${maxLength} characters)</summary>

              \`\`\`text
              ${excerpt}
              \`\`\`
              </details>`;
            } else {
              body = `${marker}
              ## Chart CI passed

              Repository hygiene and Helm validation passed. [View the workflow run](${workflowUrl}).`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Mark validation failed
        if: >-
          always() &&
          (steps.hygiene.outcome == 'failure' || steps.helm.outcome == 'failure')
        run: exit 1

  detect:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.find.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: find
        run: echo "charts=$(make changed-charts)" >> "$GITHUB_OUTPUT"

  package:
    name: package ${{ matrix.chart }}
    permissions:
      contents: read
      packages: write
    needs: [test, detect]
    if: needs.detect.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: ${{ fromJson(needs.detect.outputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: make package-chart CHART="${{ matrix.chart }}" DESTINATION=.packages
      - name: Publish chart
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push .packages/*.tgz oci://ghcr.io/makeitworkcloud/charts

  update-opencode-gitops:
    name: update opencode GitOps reference
    needs: [detect, package]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.package.result == 'success' &&
      contains(fromJson(needs.detect.outputs.charts), 'opencode-server')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read chart version
        id: chart
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" { print $2; exit }' opencode-server/Chart.yaml)"
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::332355796717:role/github-actions-chart-updater
          role-session-name: charts-opencode-gitops-updater

      - name: Read GitHub App private key
        id: app-key
        env:
          SECRET_ARN: arn:aws:secretsmanager:us-west-2:332355796717:secret:xnoto-s-chart-updater-github-app-private-key-qP4Qr3
        run: |
          set -euo pipefail
          private_key="$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --query SecretString --output text)"
          test -n "$private_key"
          echo "::add-mask::$private_key"
          {
            echo 'private-key<<EOF'
            printf '%s\n' "$private_key"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "4745727"
          private-key: ${{ steps.app-key.outputs.private-key }}
          owner: makeitworkcloud
          repositories: kustomize-cluster
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update GitOps pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = 'makeitworkcloud';
            const repo = 'kustomize-cluster';
            const base = 'main';
            const path = 'workloads/apps/opencode-app.yaml';
            const version = process.env.CHART_VERSION;
            const branch = `automation/opencode-server-${version}`;

            const { data: baseRef } = await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` });
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: baseRef.object.sha,
              });
            }

            const { data: file } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            if (Array.isArray(file) || file.type !== 'file') throw new Error(`Expected ${path} to be a file`);
            const current = Buffer.from(file.content, 'base64').toString('utf8');
            const matcher = /(chart:\s+opencode-server\s+repoURL:\s+ghcr\.io\/makeitworkcloud\/charts\s+targetRevision:\s*)[^\s]+/;
            const matches = current.match(new RegExp(matcher.source, 'g')) || [];
            if (matches.length !== 1) throw new Error(`Expected one OpenCode chart targetRevision, found ${matches.length}`);
            const updated = current.replace(matcher, `$1${version}`);

            if (updated !== current) {
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                branch,
                sha: file.sha,
                message: `chore(opencode): bump chart to ${version}`,
                content: Buffer.from(updated).toString('base64'),
              });
            }

            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
            });
            if (pullRequests.length === 0) {
              await github.rest.pulls.create({
                owner,
                repo,
                title: `chore(opencode): bump chart to ${version}`,
                head: branch,
                base,
                body: [
                  `Updates the published \`opencode-server\` OCI chart reference to \`${version}\`.`,
                  '',
                  'Generated by the charts post-publish workflow. This PR does not sync Argo CD or deploy directly.',
                ].join('\n'),
              });
            }
