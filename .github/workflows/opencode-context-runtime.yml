name: opencode-context-runtime

on:
  pull_request:
    paths:
      - .github/workflows/opencode-context-runtime.yml
      - ".github/tests/opencode-context-runtime/**"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile check
        shell: bash
        run: python3 -m py_compile .github/tests/opencode-context-runtime/runtime.py
      - name: Fixture regression tests
        shell: bash
        run: python3 -m unittest discover -s .github/tests/opencode-context-runtime -p 'test_*.py' -v
      - name: Runtime probe
        shell: bash
        run: python3 .github/tests/opencode-context-runtime/runtime.py
