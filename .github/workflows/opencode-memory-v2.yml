name: opencode-memory-v2

on:
  pull_request:
    paths:
      - ".github/workflows/opencode-memory-v2.yml"
      - ".github/tests/opencode-memory-v2/**"

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Unit tests (mocked docker/time)
        run: python3 -m unittest discover -s .github/tests/opencode-memory-v2 -p 'test_*.py' -v

      - name: Runtime fixture (stock container, synthetic data only)
        run: python3 .github/tests/opencode-memory-v2/runtime.py
