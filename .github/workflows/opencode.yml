name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  opencode:
    if: >-
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    uses: makeitworkcloud/shared-workflows/.github/workflows/opencode.yml@73444d2177762549d8c476dc612f23811e0a2180
    with:
      config-source-path: opencode-server/files
    secrets:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
