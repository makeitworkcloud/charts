apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: pptx-gateway
      namespace: pptx-jobs
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: pptx-worker
      namespace: pptx-jobs
    automountServiceAccountToken: false
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: pptx-gateway-kernel-pods
      namespace: pptx-jobs
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch", "create", "delete"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: pptx-gateway-kernel-pods
      namespace: pptx-jobs
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: pptx-gateway-kernel-pods
    subjects:
      - kind: ServiceAccount
        name: pptx-gateway
        namespace: pptx-jobs
